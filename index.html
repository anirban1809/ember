<!DOCTYPE html>
<meta charset="utf-8" />
<title>Ember Engine - Development Build</title>
<style>
    html,
    body {
        height: 100%;
        margin: 0;
        background: #0b0c10;
        color: #cfd;
        font: 14px/1.4 system-ui, -apple-system, sans-serif;
    }
    .wrap {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100%;
    }
    aside {
        padding: 16px;
        border-right: 1px solid #223;
    }
    main {
        position: relative;
        padding: 16px;
    }

    /* This element defines where the native NSView appears */
    #oglMount {
        width: min(80vw, 900px);
        height: min(60vh, 600px);
        border-radius: 12px;
        border: 2px dashed #395;
        background: #132; /* just to see the box if GL isn’t attached yet */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35) inset;
    }

    /* A quick resizer demo */
    .slider {
        width: 100%;
    }
</style>
<script>
    (function () {
        function wire() {
            const el = document.getElementById("oglMount");
            if (!el || !window.ogl || !window.ogl.setBounds) {
                // try again on next frame if preload/DOM not ready yet
                return requestAnimationFrame(wire);
            }

            let last = { x: -1, y: -1, w: -1, h: -1 };

            const send = () => {
                const r = el.getBoundingClientRect();
                const x = Math.round(r.left);
                const y = Math.round(r.top);
                const w = Math.max(1, Math.round(r.width));
                const h = Math.max(1, Math.round(r.height));
                if (
                    x !== last.x ||
                    y !== last.y ||
                    w !== last.w ||
                    h !== last.h
                ) {
                    last = { x, y, w, h };
                    // send to main -> native
                    window.ogl
                        .setBounds({ x, y, width: w, height: h })
                        .then((ok) =>
                            console.log(
                                "[Renderer] setBounds ->",
                                last,
                                "ok?",
                                ok
                            )
                        )
                        .catch((err) =>
                            console.error("[Renderer] setBounds failed", err)
                        );
                }
            };

            const ro = new ResizeObserver(() => requestAnimationFrame(send));
            ro.observe(el);

            window.addEventListener("resize", () =>
                requestAnimationFrame(send)
            );
            window.addEventListener(
                "scroll",
                () => requestAnimationFrame(send),
                { passive: true }
            );

            // do a couple RAFs so styles settle before first measurement
            requestAnimationFrame(() => requestAnimationFrame(send));
        }
        // run after load (styles applied)
        window.addEventListener("load", wire);
    })();
</script>

<div class="wrap">
    <aside>
        <h3>Controls</h3>
        <label
            >Width (% viewport):
            <input
                id="wRange"
                class="slider"
                type="range"
                min="20"
                max="95"
                value="80"
        /></label>
        <label
            >Height (% viewport):
            <input
                id="hRange"
                class="slider"
                type="range"
                min="20"
                max="90"
                value="60"
        /></label>
        <div style="margin-top: 12px">
            <button id="setIdBtn">Set IOSurface ID…</button>
        </div>
        <p style="margin-top: 8px; opacity: 0.7">
            Move the sliders — the OpenGL view resizes live to match the green
            box.
        </p>
    </aside>

    <main>
        <div id="oglMount"></div>
    </main>
</div>

<script>
    // tiny CSS hook-up so sliders update the box size
    const mount = document.getElementById("oglMount");
    const w = document.getElementById("wRange");
    const h = document.getElementById("hRange");
    const apply = () => {
        mount.style.width = `min(${w.value}vw, 1600px)`;
        mount.style.height = `min(${h.value}vh, 1200px)`;
    };
    w.addEventListener("input", apply);
    h.addEventListener("input", apply);
    apply();
</script>
<script src="./dist/renderer.js"></script>
